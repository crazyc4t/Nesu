{{ $carousel := site.Data.carousel }}
{{ if $carousel.enable }}
<div class="carousel-container" style="position: relative; width: 100%; height: 50vh; min-height: 400px; overflow: hidden; margin-bottom: 60px;">
  {{ range $index, $slide := $carousel.carousel }}
  <div class="carousel-slide" data-index="{{ $index }}" style="position: absolute; width: 100%; height: 100%; opacity: {{ if eq $index 0 }}1{{ else }}0{{ end }}; transition: opacity 1s ease-in-out; pointer-events: {{ if eq $index 0 }}auto{{ else }}none{{ end }};">
    <div style="background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)), url('/{{ $slide.image }}') center/cover; width: 100%; height: 100%; display: flex; align-items: center; justify-content: {{ $slide.position }}; padding: 0 5%;">
      <div style="color: white; padding: 60px 40px; max-width: 900px; text-align: {{ $slide.position }}; z-index: 5; position: relative;">
        <h1 style="font-size: 3.5em; margin-bottom: 30px; text-shadow: 2px 2px 8px rgba(0,0,0,0.8); line-height: 1.2;">{{ $slide.title }}</h1>
        <p style="font-size: 1.8em; text-shadow: 1px 1px 4px rgba(0,0,0,0.8); line-height: 1.4;">{{ $slide.description }}</p>
      </div>
    </div>
  </div>
  {{ end }}
  
  <!-- Navigation dots -->
  <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; z-index: 10;">
    {{ range $index, $slide := $carousel.carousel }}
    <button onclick="goToSlide({{ $index }})" class="carousel-dot" data-slide="{{ $index }}" style="width: 14px; height: 14px; border-radius: 50%; background: {{ if eq $index 0 }}white{{ else }}rgba(255,255,255,0.5){{ end }}; border: 2px solid white; cursor: pointer; transition: background 0.3s;"></button>
    {{ end }}
  </div>
</div>

<script>
let currentSlide = 0;
const slides = document.querySelectorAll('.carousel-slide');
const dots = document.querySelectorAll('.carousel-dot');
const totalSlides = slides.length;

function showSlide(index) {
  slides.forEach((slide, i) => {
    slide.style.opacity = i === index ? '1' : '0';
    slide.style.pointerEvents = i === index ? 'auto' : 'none';
  });
  dots.forEach((dot, i) => {
    dot.style.background = i === index ? 'white' : 'rgba(255,255,255,0.5)';
  });
  currentSlide = index;
}

function nextSlide() {
  const next = (currentSlide + 1) % totalSlides;
  showSlide(next);
}

function goToSlide(index) {
  showSlide(index);
}

// Auto-advance every 10 seconds
setInterval(nextSlide, 10000);
</script>
{{ end }}
