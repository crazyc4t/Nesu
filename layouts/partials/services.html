{{ if site.Data.services.enable }}
<style>
.service-card {
  position: relative;
  height: 400px;
  overflow: hidden;
  border-radius: 8px;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  cursor: pointer;
}
.service-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 30px rgba(80,0,80,0.3);
}
@media (max-width: 768px) {
  .services-grid { 
    grid-template-columns: 1fr !important; 
    padding: 20px !important; 
  }
  .services-grid h3 { 
    font-size: 1.6em !important; 
    color: white !important; 
  }
  .services-grid p { 
    font-size: 1.1em !important; 
    color: white !important; 
  }
}
</style>

<h2 style="text-align: center; margin: 60px 0 40px 0; font-size: 3em;">Our Services</h2>

<div class="services-grid" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; padding: 40px 40px; margin: 0;">
  {{ range site.Data.services.services }}
  <a href="{{ .url }}" style="text-decoration: none; color: inherit;">
    <div class="service-card">
      <img src="/{{ .img }}" alt="{{ .name }}" style="width: 100%; height: 100%; object-fit: cover;" />
      <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, transparent 85%, rgba(80,0,80,0.85) 100%); display: flex; flex-direction: column; justify-content: flex-end; padding: 40px; color: white;">
        <h3 style="color: white !important; font-size: 2.4em; margin: 0 0 12px 0; font-weight: 600;">{{ .name }}</h3>
        <p style="color: white !important; font-size: 1.4em; margin: 0; opacity: 0.95; line-height: 1.5;">{{ .description }}</p>
      </div>
    </div>
  </a>
  {{ end }}
</div>
{{ end }}
