<header class="flex items-center justify-between p-6 mb-12" style="background: white;">
  <div class="flex items-center gap-4">
    <a href="/" class="flex items-center">
      <img src="/images/logo.png" alt="Nesu Logo" class="h-12 w-auto" />
    </a>
  </div>
  <nav class="flex items-center">
    {{ range .Site.Menus.main }}
      <a href="{{ .URL }}" class="hover:text-purple-600" style="margin-right: 48px; font-size: 1.4em; color: #333;">{{ .Name }}</a>
    {{ end }}
  </nav>
</header>
