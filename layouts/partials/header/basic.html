<style>
@media (max-width: 768px) {
  header { padding: 16px 20px !important; }
  header img { height: 36px !important; }
  header nav { display: none !important; }
  header span { font-size: 1em !important; }
}
</style>
<header class="flex items-center justify-between" style="background: white; padding: 24px 40px; width: 100vw; margin-left: calc(-50vw + 50%); position: relative;">
  <div class="flex items-center gap-4">
    <a href="/" class="flex items-center gap-3" style="align-items: center; cursor: pointer;">
      <img src="/images/logo.png" alt="Nesu Logo" class="h-12 w-auto" style="cursor: pointer;" />
      <span style="font-size: 1.4em; color: #333; line-height: 1; cursor: pointer;">Facility Solutions</span>
    </a>
  </div>
  <nav class="flex items-center">
    {{ range .Site.Menus.main }}
      <a href="{{ .URL }}" class="hover:text-purple-600" style="margin-right: 48px; font-size: 1.4em; color: #333;">{{ .Name }}</a>
    {{ end }}
  </nav>
</header>
