<head>
  <meta charset="utf-8" />
  <title>{{ .Title }}</title>

  <!-- Meta For No Index -->
  <meta name="robots" content="noindex, nofollow, noimageindex" />

  <!-- Mobile responsive meta -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  />

  {{ hugo.Generator }}

  <!-- Critical CSS -->
  {{ $style := resources.Get "scss/critical.scss" | css.Sass | resources.Minify
  }}
  <link href="{{ $style.Permalink }}" rel="stylesheet" />

  {{ with .Site.Params.theme_overrides }} {{ $theme_overrides := resources.Get .
  | minify | fingerprint "sha512" }}
  <link
    rel="stylesheet"
    href="{{ $theme_overrides.RelPermalink }}"
    integrity="{{ $theme_overrides.Data.Integrity }}"
  />
  {{ end }}

  <!-- Custom Carousel CSS -->
  <link rel="stylesheet" href="{{ "css/carousel-custom.css" | absURL }}" />
  <script defer src="{{ "js/carousel-timing.js" | absURL }}"></script>

  <!-- Favicon -->
  <link rel="shortcut icon" href="{{ "images/favicon.ico" | absURL }}"
  type="image/x-icon" /> <link rel="icon" href="{{ "images/favicon.png" | absURL
  }}" type="image/x-icon" /> {{ with .Site.Params.googleAnalytics }}
  <!-- Global Site Tag (gtag.js) - Google Analytics -->
  <script
    async
    src="https://www.googletagmanager.com/gtag/js?id={{ . }}"
  ></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() {
      dataLayer.push(arguments);
    }
    gtag("js", new Date());
    gtag("config", "{{ . }}");
  </script>
  {{ end }}
</head>
